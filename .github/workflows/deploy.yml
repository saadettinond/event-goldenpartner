name: event.goldenpartner.com.tr dağıtımı

on:
  push:
    branches: [main, deploy-test]
  workflow_dispatch:

concurrency:
  group: deploy-event
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secret kontrolü
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::error::FTP_SERVER / FTP_USERNAME / FTP_PASSWORD secret'ları eksik. Dağıtım yapılmadı."
            exit 1
          fi

      - name: Emniyet kilidi — hedef klasör ana site olmamalı
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp >/dev/null
          LIST=$(lftp -c "set ftp:ssl-allow yes; set ssl:verify-certificate no; set net:max-retries 2; set net:timeout 20; open -u '$FTP_USERNAME' --env-password '$FTP_SERVER'; cls -1a") \
            || { echo "::error::FTP bağlantısı kurulamadı."; exit 1; }
          echo "Hedef klasör içeriği:"; echo "$LIST"
          if echo "$LIST" | sed 's#/$##' | grep -Eqx '(wp-config\.php|wp-content|wp-admin|wp-includes|wp-login\.php|dubai|yunanistan|ingiltere|egitim|event|public_html|domains)'; then
            echo "::error::Hedef klasör event klasörü değil (ana site / üst klasör görünüyor). Dağıtım DURDURULDU."
            exit 1
          fi

      - name: Dosyaları yükle (silme yok; sunucudaki ayarlar.php ve talepler/ dokunulmaz)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "set ftp:ssl-allow yes; set ftp:ssl-protect-data yes; set ssl:verify-certificate no; set net:max-retries 3; set net:timeout 30; open -u '$FTP_USERNAME' --env-password '$FTP_SERVER'; mirror -R --verbose --no-perms --no-symlinks --parallel=3 -x '^\.git' -x '^\.github/' -x '^ayarlar\.php$' -x '\.DS_Store$' -x '^README' ./ ./"

      - name: Ayar dosyası (mail + CRM) — GitHub secret'larından
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          LEAD_MAIL_TO: ${{ secrets.LEAD_MAIL_TO }}
          CRM_API_KEY: ${{ secrets.CRM_API_KEY }}
          OPENAI_CAPI_KEY: ${{ secrets.OPENAI_CAPI_KEY }}
          OPENAI_PIXEL_ID: ${{ vars.OPENAI_PIXEL_ID }}
        run: |
          if [ -z "$LEAD_MAIL_TO" ] && [ -z "$CRM_API_KEY" ]; then
            echo "LEAD_MAIL_TO / CRM_API_KEY secret'ı yok — sunucudaki ayarlar.php'ye dokunulmadı."; exit 0
          fi
          umask 077; TMP=$(mktemp -d)
          python3 .github/ayarlar-olustur.py "$TMP/ayarlar.php"
          php_ok=$(command -v php >/dev/null && php -l "$TMP/ayarlar.php" >/dev/null && echo ok || echo skip); echo "php -l: $php_ok"
          lftp -c "set ftp:ssl-allow yes; set ftp:ssl-protect-data yes; set ssl:verify-certificate no; set net:max-retries 3; set net:timeout 30; open -u '$FTP_USERNAME' --env-password '$FTP_SERVER'; put '$TMP/ayarlar.php' -o ayarlar.php"
          rm -rf "$TMP"
