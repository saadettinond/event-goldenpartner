name: event.goldenpartner.com.tr dağıtımı

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-event
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secret kontrolü
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::error::FTP_SERVER / FTP_USERNAME / FTP_PASSWORD secret'ları eksik. Dağıtım yapılmadı."
            exit 1
          fi

      - name: Emniyet kilidi — hedef klasör ana site olmamalı
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp >/dev/null
          LIST=$(lftp -u "$FTP_USERNAME","$FTP_PASSWORD" \
            -e "set ftp:ssl-allow yes; set ssl:verify-certificate no; set net:max-retries 2; set net:timeout 20; cls -1a; bye" \
            "$FTP_SERVER") || { echo "::error::FTP bağlantısı kurulamadı."; exit 1; }
          echo "Hedef klasör içeriği:"; echo "$LIST"
          if echo "$LIST" | sed 's#/$##' | grep -Eqx '(wp-config\.php|wp-content|wp-admin|wp-includes|wp-login\.php|dubai|yunanistan|ingiltere|egitim|event|public_html|domains)'; then
            echo "::error::Hedef klasör event klasörü değil (ana site / üst klasör görünüyor). Dağıtım DURDURULDU."
            exit 1
          fi

      - name: Dosyaları yükle (sadece değişenler, sunucudaki ayarlar.php ve talepler/ dokunulmaz)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          local-dir: ./
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            ayarlar.php
            talepler/*.csv
            talepler/*.log
            talepler/.rl_*
            **/.DS_Store
